# Qwen3.5-0.8B countdown with NATIVE thinking (T4 free).
# Needs transformers@main (notebook setup cell installs it).
# Format: reason in <think>, final equation alone on last line (no <answer> tags).
# Same 256 tok cap as the non-thinking run; watch truncation rate in logs.
model: principled-intelligence/Qwen3.5-0.8B-text-only
output_dir: /content/drive/MyDrive/rl-mini/countdown-q35-08b-think
thinking: true
num_tasks: 2000
num_numbers: 4
num_generations: 8
# Thinking traces fill the 256 tok cap: batch 2x4 fits T4 where 4x2 OOMs
# (selective_log_softmax over the 248k vocab). Same 16 traj/step throughput.
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_completion_length: 256
max_steps: 300
learning_rate: 0.000001
beta: 0.001
temperature: 1.0
top_p: 1.0
use_peft: true
lora_r: 32
lora_alpha: 64
lora_target_modules: [q_proj, v_proj]
logging_steps: 5
save_steps: 25
resume: false
gradient_checkpointing: true
# Fused kernels dodge the 248k-vocab logits OOM. Needs: pip install liger-kernel.
# If TRL errors on unknown arch, set back to false (batch 2 above fits anyway).
use_liger_loss: true
