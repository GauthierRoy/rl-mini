# Colab T4 smoke: 0.5B, G=4, 50 steps, no vLLM
model: Qwen/Qwen2.5-0.5B-Instruct
dataset: gsm8k
output_dir: outputs/smoke
num_generations: 4
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
max_prompt_length: 256
max_completion_length: 256
max_steps: 50
learning_rate: 1.0e-6
beta: 0.001
temperature: 0.9
use_peft: true
lora_r: 16
lora_alpha: 32
use_vllm: false
log_with: none
logging_steps: 5
save_steps: 25
reward_weights: {correctness: 2.0, format: 0.5, length_penalty: 0.0}
