# Qwen3.5-0.8B countdown, SFT cold-start + correctness-only RL (T4 free).
# Model = SFT-merged output of configs/sft_format_08b.yaml (bare equations).
# Reward scans free text, tiered 2.0/0.3/0.1, no format requirements.
model: /content/drive/MyDrive/rl-mini/sft-format-08b-merged
output_dir: /content/drive/MyDrive/rl-mini/countdown-q35-08b-v3
thinking: false
num_tasks: 2000
num_numbers: 4
num_generations: 8
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
max_completion_length: 256
max_steps: 300
learning_rate: 0.000005
beta: 0.001
temperature: 1.0
top_p: 1.0
use_peft: true
lora_r: 32
lora_alpha: 64
lora_target_modules: [q_proj, v_proj]
logging_steps: 5
save_steps: 25
resume: false
gradient_checkpointing: false
use_liger_loss: true
mask_truncated_completions: true
