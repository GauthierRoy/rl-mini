# SFT cold-start: 200 bare-equation traces so GRPO starts with signal.
# Programmatic solver (no teacher needed); 1 epoch on T4 ~ minutes.
# Output merged fp model feeds the v3 RL config below.
model: principled-intelligence/Qwen3.5-0.8B-text-only
output_dir: /content/drive/MyDrive/rl-mini/sft-format-08b
merged_dir: /content/drive/MyDrive/rl-mini/sft-format-08b-merged
num_tasks: 200
num_numbers: 4
seed: 0
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
num_train_epochs: 1
learning_rate: 0.0002
lora_r: 32
lora_alpha: 64
lora_target_modules: [q_proj, v_proj]
max_seq_length: 256
logging_steps: 5
save_steps: 50
gradient_checkpointing: true
