# Qwen3.5-0.8B countdown on Colab T4 free.
# Text-only fork: same tokenizer/template as Qwen/Qwen3.5-0.8B without the
# vision encoder (fits TRL + AutoTokenizer flow, ~5-17% less VRAM).
# Sampling per model card (non-thinking text): temp 1.0, top_p 1.0.
model: principled-intelligence/Qwen3.5-0.8B-text-only
output_dir: /content/drive/MyDrive/rl-mini/countdown-q35-08b
num_tasks: 2000
num_numbers: 4
num_generations: 8
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
max_completion_length: 256
max_steps: 300
learning_rate: 0.000001
beta: 0.001
temperature: 1.0
top_p: 1.0
use_peft: true
lora_r: 32
lora_alpha: 64
lora_target_modules: [q_proj, v_proj]
logging_steps: 5
save_steps: 25
resume: false
gradient_checkpointing: false
